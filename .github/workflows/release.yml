name: release

# The release pipeline — every push to develop cuts the next numbered dev
# build automatically (mirrors the ZaminTorch release pipeline):
#
#   1. compute N over the abaser-1.8.8-N tag ledger;
#   2. stamp the version into build.gradle and Abaser.VERSION
#      (mcmod.info picks it up automatically through processResources);
#   3. sync the bump back to develop as an Abasing-authored "[skip ci]"
#      commit (the loop-breaker: the pipeline's own push must not retrigger)
#      — BEFORE building, so the jar is always built from the exact tree
#      that gets tagged, even if a rebase pulls in newer commits mid-run;
#   4. build both artifacts: the companion mod with the verified 1.8.8
#      toolchain (JDK 8 + Gradle 4.10.3 + ForgeGradle 2.1, one retry for
#      network flakes during the Forge/MCP downloads) and the standalone
#      Abaser Clicker exe (cross-compiled with MinGW-w64 from the same tree);
#   5. tag abaser-1.8.8-N (lightweight);
#   6. publish the reobfuscated mod jar (+ sources jar) and the clicker exe
#      as a PRERELEASE through gh, with auto-generated notes (commits since
#      the previous tag; an optional title via workflow_dispatch input or a
#      "Release-Title:" trailer in a commit message).
#
# Failure safety: a build failure pushes no tag and cuts no release —
# the next run (or a re-run) reuses the same number and the already-pushed
# bump commit. A run that dies between tag and release is resumed by the
# orphan-tag repair path. Everything — bump commit, tag push, release — is
# authored as Abasing through the ABASING_TOKEN secret (falling back to
# github.token only if the secret is unset), never github-actions[bot].
#
# Escape hatches:
#   - a head commit carrying [skip ci] / [ci skip] / [no ci] postpones its
#     push's release to the next push;
#   - a manual workflow_dispatch cuts an off-cycle release with a title;
#   - re-running a run that already published is a no-op.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      title:
        description: "Optional release title (otherwise the Release-Title: commit trailer, or a default)"
        required: false
        type: string

# Releases queue behind each other; a cancelled mid-flight release could
# leak half-pushed state, so never cancel.
concurrency:
  group: release-develop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !(contains(github.event.head_commit.message, '[skip ci]') ||
        contains(github.event.head_commit.message, '[ci skip]') ||
        contains(github.event.head_commit.message, '[no ci]') ||
        contains(github.event.head_commit.message, '[skip actions]') ||
        contains(github.event.head_commit.message, '[actions skip]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop (as Abasing)
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.ABASING_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up Java 8 (ForgeGradle 2.1 era)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compute the next build number
        id: version
        env:
          GH_TOKEN: ${{ secrets.ABASING_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          numbered_tags() {
            git tag -l | while IFS= read -r t; do
              n=$(printf '%s' "$t" | sed -nE 's/^abaser-1\.8\.8-([0-9]+)$/\1/p')
              if [ -n "$n" ]; then printf '%s %s\n' "$n" "$t"; fi
            done | sort -n
          }

          LAST_LINE=$(numbered_tags | tail -1)
          if [ -n "$LAST_LINE" ]; then
            LAST_NUM=${LAST_LINE%% *}
            PREV_TAG=${LAST_LINE#* }
          else
            LAST_NUM=0
            PREV_TAG=""
          fi

          HEAD_TAG=$(git tag --points-at HEAD | grep -E '^abaser-1\.8\.8-[0-9]+$' | sed -n '1p' || true)

          SKIP=false
          REPAIR=false
          N=$(( LAST_NUM + 1 ))
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$HEAD_TAG" ]; then
            if gh release view "$HEAD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "HEAD is already released as $HEAD_TAG — nothing to do."
              SKIP=true
            else
              # A previous run died between the tag push and the release:
              # resume that number instead of burning it.
              echo "Found orphan tag $HEAD_TAG at HEAD (release missing) — resuming it."
              N=$(printf '%s' "$HEAD_TAG" | sed -nE 's/^abaser-1\.8\.8-([0-9]+)$/\1/p')
              REPAIR=true
            fi
          fi

          {
            echo "number=$N"
            echo "version=2.1-dev.$N"
            echo "tag=abaser-1.8.8-$N"
            echo "prev_tag=$PREV_TAG"
            echo "repair=$REPAIR"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "Next release: abaser-1.8.8-$N (ledger high: $LAST_NUM, previous tag: ${PREV_TAG:-none}, repair: $REPAIR, skip: $SKIP)"

      - name: Stamp the version (build.gradle + @Mod VERSION)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$V\"/" build.gradle
          sed -i "s/public static final String VERSION = \"[^\"]*\";/public static final String VERSION = \"$V\";/" \
            src/main/java/net/zaminmc/abaser/Abaser.java
          echo "--- stamped:"
          grep -n '^version' build.gradle
          grep -n 'String VERSION' src/main/java/net/zaminmc/abaser/Abaser.java

      - name: Sync the version bump back to develop (as Abasing)
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.repair != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "Abasing"
          git config user.email "zaminpro2.0@gmail.com"
          if git diff --quiet; then
            echo "source already carries $TAG — no bump commit needed"
            exit 0
          fi
          git add build.gradle \
                  src/main/java/net/zaminmc/abaser/Abaser.java
          git commit -m "release: $TAG — version bump [skip ci]"
          for attempt in 1 2; do
            if git pull --rebase origin develop && git push origin develop; then
              echo "bump pushed as $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "::warning::push raced a concurrent commit (attempt $attempt) — rebasing and retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not sync the bump (develop moved underneath twice) — re-run the workflow"
          exit 1

      - name: Build the mod (one retry for Forge/MCP download flakes)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! ./gradlew --no-daemon setupCIWorkspace build; then
            echo "::warning::first build failed — retrying once (first-run Forge/MCP downloads are flake-prone)"
            ./gradlew --no-daemon setupCIWorkspace build
          fi
          V="${{ steps.version.outputs.version }}"
          ls -la "build/libs/Abaser-1.8.8-$V.jar" \
                 "build/libs/Abaser-1.8.8-$V-sources.jar"

      - name: Install the cross toolchain (MinGW-w64)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y g++-mingw-w64-x86-64
          x86_64-w64-mingw32-g++ --version | sed -n '1p'

      - name: Build the clicker executable (cross-compiled)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # absolute path: CMake 3.31 refuses relative CMAKE_TOOLCHAIN_FILE
          cmake -S exe -B exe-build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/exe/mingw-toolchain.cmake" \
            -DABASER_VERSION="$V"
          cmake --build exe-build --parallel
          ls -la exe-build/AbaserClicker.exe
          cp exe-build/AbaserClicker.exe "Abaser-Clicker-$V-win64.exe"
          sha256sum "Abaser-Clicker-$V-win64.exe"

      - name: Tag the release (lightweight)
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
          fi
          if ! git push origin "refs/tags/$TAG"; then
            # Rejected: the tag exists remotely. Accept only if it is the
            # exact same tree (a racing/repaired run), never silently move it.
            git fetch --tags --force origin
            if [ "$(git rev-parse "refs/tags/$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::remote tag $TAG points at a different commit — investigate manually"
              exit 1
            fi
            echo "remote tag $TAG already points at HEAD — accepting"
          fi
          echo "tagged $(git rev-parse --short HEAD) as $TAG"

      - name: Generate the release notes
        if: steps.version.outputs.skip != 'true'
        env:
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail
          N="${{ steps.version.outputs.number }}"
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.version.outputs.prev_tag }}"

          # The version-bump commits ("release: abaser-…") are pipeline
          # infrastructure, not changes — keep them out of the notes.
          if git log -1 --format=%s HEAD | grep -q '^release: abaser-'; then
            RANGE_END="HEAD^"
          else
            RANGE_END="HEAD"
          fi
          if [ -n "$PREV" ]; then RANGE="$PREV..$RANGE_END"; else RANGE="$RANGE_END"; fi

          COUNT=$(git rev-list --count "$RANGE")
          SHORTSTAT=$(git diff --shortstat "$RANGE" || true)
          SHORT_SHA=$(git rev-parse --short "$RANGE_END")

          # Title precedence: dispatch input > Release-Title: trailer > default.
          TITLE="$INPUT_TITLE"
          if [ -z "$TITLE" ]; then
            # grep without -m1 / head: an early-exiting consumer would SIGPIPE
            # git log under pipefail and silently lose the title.
            TITLE=$(git log --format=%B "$RANGE" | grep '^Release-Title:' \
                    | sed -n '1s/^Release-Title:[[:space:]]*//p' || true)
          fi
          if [ -z "$TITLE" ]; then TITLE="Abaser build $N — clicker exe + companion mod"; fi
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "title: $TITLE"

          {
            echo "Dev build \`$TAG\` — auto-cut from \`develop\` @ \`$SHORT_SHA\` ($COUNT commit(s) since \`${PREV:-the beginning}\`$([ -n "$SHORTSTAT" ] && echo ", $SHORTSTAT" || echo))."
            echo
            if [ -n "$PREV" ]; then
              echo "Full diff: [$PREV...$TAG](https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG)"
              echo
            fi
            echo "### Changes"
            echo
            { git log --reverse --format='- %s' "$RANGE" \
              | grep -v '^- release: abaser-' \
              | awk '{ if (length($0) > 200) print substr($0, 1, 200) "…"; else print }' || true; }
            echo
            echo "<details><summary>Full commit messages</summary>"
            echo
            { git log --reverse --format='%h %s%n%n%b%n---' "$RANGE" \
              | grep -v '^[0-9a-f]\{7\} release: abaser-' || true; }
            echo
            echo "</details>"
            echo
            echo "### Artifacts"
            echo
            echo "- \`Abaser-Clicker-$V-win64.exe\` — **the auto-clicker**. Standalone Windows executable (Win32 + Dear ImGui + DX9): run it next to the game, \`F4\` toggles, \`INSERT\`/\`X\` park it in the system tray (right-click the tray icon to arm/disarm, start it with Windows, or exit). Finds the Minecraft (LWJGL) window and posts clicks to that window only."
            echo "- \`Abaser-1.8.8-$V.jar\` — the companion mod shell. Loads silently with Forge 1.8.8; it no longer auto-clicks (that is the exe's job now) and answers \`/abaser\` in chat."
            echo "- \`Abaser-1.8.8-$V-sources.jar\` — matching mod sources."
            echo
            EXE_SHA=$(sha256sum "Abaser-Clicker-$V-win64.exe" | cut -d' ' -f1)
            echo "SHA256 (\`Abaser-Clicker-$V-win64.exe\`): \`$EXE_SHA\`"
            echo
            echo "### Install"
            echo
            echo "1. Download \`Abaser-Clicker-$V-win64.exe\` (and check the SHA256 above)."
            echo "2. If SmartScreen warns (unsigned binary): right-click → Properties → **Unblock**, then run it."
            echo "3. In game, press **F4** to toggle the clicker, **INSERT** (or the X button) to park it in the tray — the clickers keep running; right-click the tray icon for the menu (arm/disarm, start with Windows, exit). Settings persist in \`abaser.ini\` next to the exe; \"Start with Windows\" (Settings tab or tray menu) launches it straight into the tray at login."
            echo "4. Optional: drop the mod jar into \`.minecraft/mods\` (Forge \`11.15.0.1655\`) — a silent shell with the \`/abaser\` info command."
          } > notes.md
          echo "--- notes.md (first 40 lines):"
          head -40 notes.md

      - name: Publish the prerelease (as Abasing)
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.ABASING_TOKEN || github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            "Abaser-Clicker-$V-win64.exe" \
            "build/libs/Abaser-1.8.8-$V.jar" \
            "build/libs/Abaser-1.8.8-$V-sources.jar"
          echo "--- published:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,isPrerelease,author,url \
            -q '"name=" + .name + " tag=" + .tagName + " prerelease=" + (.isPrerelease|tostring) + " author=" + .author.login + " url=" + .url'
